[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tribal-knowledge-mapper"
version = "2.0.0-rc1"
description = "Claude Code skill — Meta tribal knowledge mapping + graphify hybrid (AST + community + confidence + benchmark)"
readme = "README.md"
license = {text = "MIT"}
keywords = ["claude", "claude-code", "tribal-knowledge", "compass", "tree-sitter", "leiden", "louvain", "mcp"]
requires-python = ">=3.10"

dependencies = [
    "networkx>=3.0",
]

[project.optional-dependencies]
ast = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
]
leiden = ["graspologic; python_version < '3.13'"]
mcp = ["mcp>=1.0.0"]
schema = ["jsonschema"]
all = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
    "graspologic; python_version < '3.13'",
    "mcp>=1.0.0",
    "jsonschema",
]

[project.scripts]
tribal = "tribal.__main__:main"

[project.urls]
Homepage = "https://github.com/hoge2021/claude-code-sagyo01"
Issues = "https://github.com/hoge2021/claude-code-sagyo01/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tribal*"]

[tool.setuptools.package-data]
tribal = ["templates/.claude/**/*"]
